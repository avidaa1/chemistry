<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f0d;--bg2:#111a15;--bg3:#162019;
  --fg:#f0ede6;--teal:#2dd4a0;--teal2:#4ade80;
  --muted:rgba(240,237,230,.5);--border:rgba(45,212,160,.18);
  --r:8px;--rl:12px
}
html{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6}
body{max-width:920px;margin:0 auto;padding:0 0 4rem}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1rem;background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:99
}
.site-title{font-weight:800;font-size:1rem;color:var(--teal);letter-spacing:.02em}
.site-back{font-size:11px;color:var(--muted)}
.site-back:hover{color:var(--teal)}
.main{padding:1rem 1rem 0}
.tab-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.ct{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--muted);cursor:pointer;font-size:12px;padding:.35rem .8rem;
  transition:.18s;font-family:inherit
}
.ct:hover{color:var(--fg);border-color:var(--teal)}
.ct.active{color:var(--teal);border-color:rgba(45,212,160,.45);background:rgba(45,212,160,.08)}
.card{border-radius:var(--rl);margin-bottom:7px;overflow:hidden}
.card-hd{display:flex;align-items:flex-start;gap:.65rem;padding:.8rem;cursor:pointer;user-select:none;background:var(--bg2)}
.card-hd:hover{background:var(--bg3)}
.card-em{font-size:1.4rem;flex-shrink:0;line-height:1}
.card-title{font-weight:700;font-size:.88rem}
.card-sub{font-size:10.5px;color:var(--muted)}
.card-arrow{margin-left:auto;color:var(--muted);font-size:.75rem;flex-shrink:0;padding-top:2px}
.card-bd{padding:.75rem 1rem 1rem;font-size:12px;color:rgba(240,237,230,.82);line-height:1.75;border-top:1px solid var(--border);background:var(--bg2)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:1.25rem}
.stat-card{border-radius:var(--rl);padding:.75rem;text-align:center}
.stat-val{font-size:1.3rem;font-weight:800}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.sec-hd{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:.9rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.hero{background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2);border-radius:var(--rl);padding:1rem;margin-bottom:1.25rem;font-size:12.5px;color:rgba(240,237,230,.85);line-height:1.75}
.input-row{display:flex;gap:8px;margin:.5rem 0}
.chem-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-family:monospace;font-size:13px;padding:.4rem .7rem;flex:1;outline:none}
.chem-input:focus{border-color:var(--teal)}
.chem-btn{background:rgba(45,212,160,.12);border:1px solid rgba(45,212,160,.35);border-radius:var(--r);color:var(--teal);cursor:pointer;font-size:12px;font-family:inherit;padding:.4rem 1rem;transition:.18s}
.chem-btn:hover{background:rgba(45,212,160,.22)}
.result-box{background:var(--bg3);border-radius:var(--rl);padding:.75rem;margin-top:.5rem;font-size:12px;min-height:40px}
.ph-bar{height:22px;border-radius:var(--r);background:linear-gradient(90deg,#ef4444 0%,#f97316 14%,#eab308 28%,#22c55e 50%,#3b82f6 70%,#6366f1 85%,#a855f7 100%);margin:.5rem 0;position:relative}
.ph-marker{position:absolute;top:-5px;width:2px;height:32px;background:var(--fg);transform:translateX(-50%)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:.4rem .5rem;font-weight:600;border-bottom:1px solid var(--border)}
td{padding:.33rem .5rem;border-bottom:1px solid rgba(45,212,160,.05)}
tr:last-child td{border-bottom:none}
.footer{text-align:center;padding:2rem 1rem;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:2rem}
.pt-fb{background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:10px;padding:.25rem .6rem;font-family:inherit;transition:.15s}
.pt-fb:hover{color:var(--fg)}
.pt-fb.pfa{background:rgba(45,212,160,.08);border-color:var(--teal);color:var(--teal)}
.pt-el{border-radius:4px;padding:3px 2px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.12s}
.pt-el:hover{transform:scale(1.1);z-index:3;position:relative}
.sel-sm{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-family:inherit;font-size:11px;padding:.3rem .5rem;outline:none;cursor:pointer}
@media(max-width:600px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .site-title{font-size:.9rem}
  body{font-size:13px}
}
</style>
<style id="mp-20261124">/* mobile pass + AVIDAA design system v1 (20261124) */html{-webkit-text-size-adjust:100%}img,video{max-width:100%;height:auto}iframe{max-width:100%}pre{max-width:100%;overflow-x:auto}/* AVIDAA design system v1 (20261124). Inline this file into a page; pages stay single files.
   Rule of thumb: tokens first, components named .av-*, baseline polish only through :where() (zero specificity) so a page's own styles always win. */
:root{
  /* base */
  --av-bg:#050818; --av-bg2:#0B0F30; --av-surface:rgba(255,255,255,.06); --av-surface-2:rgba(255,255,255,.10);
  --av-line:rgba(255,255,255,.16); --av-fg:#F3F1FF; --av-muted:#B3B0DD; --av-focus:#FFD93D;
  /* sector colors */
  --av-aegis:#FF4D6D; --av-knowledge:#5BC0FF; --av-games:#B28DFF; --av-kids:#FFD93D; --av-music:#FF7AA8; --av-tools:#4ADE80; --av-archive:#8892B0;
  --av-accent:var(--av-knowledge);
  /* one type scale (px) */
  --av-fs-0:14px; --av-fs-1:16px; --av-fs-2:18px; --av-fs-3:22px; --av-fs-4:28px; --av-fs-5:36px; --av-fs-6:48px;
  /* spacing scale (px) */
  --av-s-1:4px; --av-s-2:8px; --av-s-3:12px; --av-s-4:16px; --av-s-5:24px; --av-s-6:32px; --av-s-7:48px; --av-s-8:64px;
  /* shape, motion */
  --av-r-sm:10px; --av-r:16px; --av-r-lg:26px; --av-r-pill:999px;
  --av-ease:cubic-bezier(.2,.8,.2,1); --av-t:.18s;
  --av-font:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Varela Round',system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --av-mono:ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;
  --av-header-h:48px;
}
/* focus: always visible, always the same */
:focus-visible{outline:3px solid var(--av-focus)!important;outline-offset:2px!important;border-radius:6px}
/* baseline polish for unstyled controls (zero specificity: page styles win) */
:where(button:not([class]):not([style]),input[type=button]:not([class]),input[type=submit]:not([class])){
  min-height:44px;min-width:44px;padding:0 var(--av-s-4);border-radius:var(--av-r-pill);border:2px solid var(--av-line);
  background:var(--av-surface-2);color:var(--av-fg);font:700 var(--av-fs-1)/1 var(--av-font);cursor:pointer;
  transition:transform var(--av-t) var(--av-ease),background var(--av-t) var(--av-ease)}
:where(button:not([class]):not([style]):hover){background:rgba(255,255,255,.18)}
:where(button:not([class]):not([style]):active){transform:scale(.97)}
:where(input[type=text],input[type=search],input[type=email],input[type=number],input[type=password],select,textarea):where(:not([class]):not([style])){
  min-height:44px;padding:0 var(--av-s-3);border-radius:var(--av-r-sm);border:2px solid var(--av-line);background:rgba(0,0,0,.35);color:var(--av-fg);font:600 var(--av-fs-1) var(--av-font)}
:where(a:not([class])){text-underline-offset:3px;text-decoration-thickness:1.5px}
/* components */
.av-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--av-s-2);min-height:44px;min-width:44px;padding:0 var(--av-s-5);border-radius:var(--av-r-pill);border:0;cursor:pointer;
  font:800 var(--av-fs-1)/1 var(--av-font);color:#1B1640;background:linear-gradient(110deg,#FFD93D,#FF7AA8);text-decoration:none;
  transition:transform var(--av-t) var(--av-ease),filter var(--av-t) var(--av-ease),box-shadow var(--av-t) var(--av-ease)}
.av-btn:hover{filter:brightness(1.08);box-shadow:0 8px 24px -8px var(--av-accent)}
.av-btn:active{transform:scale(.96)}
.av-btn--ghost{background:var(--av-surface-2);color:var(--av-fg);border:2px solid var(--av-line)}
.av-btn--sm{padding:0 var(--av-s-4);font-size:var(--av-fs-0)}
.av-card{position:relative;padding:var(--av-s-5);border-radius:var(--av-r-lg);border:2px solid color-mix(in srgb,var(--av-accent) 55%,transparent);
  background:radial-gradient(110% 80% at 50% 0%,color-mix(in srgb,var(--av-accent) 20%,transparent),transparent 75%),var(--av-surface);
  box-shadow:0 14px 30px -18px var(--av-accent);transition:transform var(--av-t) var(--av-ease),box-shadow var(--av-t) var(--av-ease)}

<body>

<script>
// ── HELPERS ──────────────────────────────────────────────────────────────────

function statBar(stats) {
  var h = '<div class="stat-grid">';
  stats.forEach(function(s) {
    var col = s.col || '#2dd4a0';
    h += '<div class="stat-card" style="background:var(--bg2);border:1px solid ' + col + '33">';
    h += '<div class="stat-val" style="color:' + col + '">' + s.v + '</div>';
    h += '<div class="stat-lbl">' + s.l + '</div></div>';
  });
  return h + '</div>';
}

function secHead(text, col) {
  return '<div class="sec-hd" style="color:' + (col || '#2dd4a0') + '">' + text + '</div>';
}

function tbl(heads, rows, col) {
  var c = col || '#2dd4a0';
  var h = '<div class="tbl-wrap"><table><tr>';
  heads.forEach(function(hd) { h += '<th style="color:' + c + '">' + hd + '</th>'; });
  h += '</tr>';
  rows.forEach(function(row) {
    h += '<tr>';
    row.forEach(function(cell, i) {
      h += '<td style="color:' + (i === 0 ? 'var(--fg)' : 'var(--muted)') + '">' + cell + '</td>';
    });
    h += '</tr>';
  });
  return h + '</table></div>';
}

function makeCards(arr, col) {
  var h = '';
  arr.forEach(function(item) {
    var bc = col || '#2dd4a0';
    h += '<div class="card" style="border:1px solid ' + bc + '18">';
    h += '<div class="card-hd" onclick="toggleCard(this)">';
    h += '<div class="card-em">' + (item.em || '') + '</div>';
    h += '<div style="flex:1"><div class="card-title" style="color:' + bc + '">' + item.title + '</div>';
    if (item.sub) h += '<div class="card-sub">' + item.sub + '</div>';
    h += '</div><div class="card-arrow">&#x25b8;</div></div>';
    h += '<div class="card-bd" style="display:none">' + item.body + '</div></div>';
  });
  return h;
}

function toggleCard(el) {
  var bd = el.parentElement.querySelector('.card-bd');
  if (!bd) return;
  var open = bd.style.display !== 'none';
  bd.style.display = open ? 'none' : 'block';
  var ar = el.querySelector('.card-arrow');
  if (ar) ar.textContent = open ? '\u25b8' : '\u25be';
}
window.toggleCard = toggleCard;

function infoBox(html, col) {
  return '<div style="background:rgba(' + (col || '45,212,160') + ',.07);border:1px solid rgba(' + (col || '45,212,160') + ',.2);border-radius:var(--rl);padding:.85rem;font-size:12px;line-height:1.8;margin-bottom:.75rem">' + html + '</div>';
}

// ── ATOMS ────────────────────────────────────────────────────────────────────

function renderAtoms(el) {
  var col = '#a855f7';
  var h = '';

  h += secHead('Subatomic Particles', col);
  h += tbl(['Particle', 'Symbol', 'Charge', 'Mass (u)', 'Location'],
    [['Proton', 'p\u207a', '+1', '1.00728', 'Nucleus'],
     ['Neutron', 'n\u2070', '0', '1.00866', 'Nucleus'],
     ['Electron', 'e\u207b', '\u22121', '0.000549', 'Orbitals (shells)'],
     ['Nucleus', '&#x2014;', 'positive', '~99.97% mass', 'Center of atom']], col);

  h += secHead('Electron Shells', col);
  h += tbl(['Shell', 'n', 'Max electrons', 'Subshells'],
    [['K', '1', '2', '1s'],
     ['L', '2', '8', '2s, 2p'],
     ['M', '3', '18', '3s, 3p, 3d'],
     ['N', '4', '32', '4s, 4p, 4d, 4f']], col);

  h += secHead('Orbital Shapes', col);
  h += tbl(['Orbital', 'Shape', 'Max e\u207b', 'Notes'],
    [['s', 'Sphere', '2', '1 per subshell'],
     ['p', 'Dumbbell (3 axes: x, y, z)', '6', '3 per subshell'],
     ['d', 'Clover (5 types)', '10', '5 per subshell'],
     ['f', 'Complex (7 types)', '14', '7 per subshell']], col);

  h += secHead('Quantum Numbers', col);
  h += tbl(['Number', 'Symbol', 'Values', 'Describes'],
    [['Principal', 'n', '1, 2, 3\u2026', 'Shell / energy level'],
     ['Azimuthal', 'l', '0 to n\u22121', 'Orbital shape (s=0, p=1, d=2, f=3)'],
     ['Magnetic', 'm\u2097', '\u2212l to +l', 'Orbital orientation in space'],
     ['Spin', 'm\u209b', '+\u00bd, \u2212\u00bd', 'Electron spin direction']], col);

  h += secHead('Filling Rules', col);
  h += makeCards([
    {em: '1\ufe0f\u20e3', title: 'Aufbau Principle', sub: 'Fill lowest energy orbitals first',
     body: 'Order: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 4f, 5d\u2026<br>' +
           'The n+l rule determines energy order: 4s (n+l=4) fills before 3d (n+l=5).<br>' +
           'Example: Iron (Fe, Z=26): [Ar] 4s\u00b2 3d\u2076'},
    {em: '2\ufe0f\u20e3', title: 'Pauli Exclusion Principle', sub: 'No two electrons identical quantum numbers',
     body: 'Maximum 2 electrons per orbital &#8212; they must have opposite spins (+\u00bd and \u2212\u00bd).<br>' +
           'This is why capacity doubles: s=2, p=6, d=10, f=14.<br>' +
           'Consequence: matter is stable &#8212; electrons cannot all collapse to lowest energy.'},
    {em: '3\ufe0f\u20e3', title: "Hund's Rule", sub: 'Maximize unpaired spins in equal-energy orbitals',
     body: 'When filling orbitals of equal energy, place one electron in each orbital before pairing.<br>' +
           'Each singly-occupied orbital has same spin direction (+\u00bd).<br>' +
           'Carbon (Z=6): 1s\u00b2 2s\u00b2 2p\u00b9 2p\u00b9 (not 2p\u00b2 in one orbital).<br>' +
           'This minimizes electron-electron repulsion energy.'}
  ], col);

  h += secHead('Ionization Energy &#8212; Selected Elements', col);
  h += tbl(['Element', 'Symbol', '1st IE (eV)', 'Notes'],
    [['Helium', 'He', '24.59', 'Highest &#8212; noble gas, full shell'],
     ['Fluorine', 'F', '17.42', 'High electronegativity'],
     ['Neon', 'Ne', '21.56', 'Noble gas'],
     ['Nitrogen', 'N', '14.53', 'Half-filled 2p subshell stability'],
     ['Oxygen', 'O', '13.62', ''],
     ['Hydrogen', 'H', '13.60', 'Reference atom'],
     ['Carbon', 'C', '11.26', ''],
     ['Sodium', 'Na', '5.14', 'Low &#8212; alkali metal, outer 3s\u00b9'],
     ['Potassium', 'K', '4.34', 'Larger atomic radius'],
     ['Cesium', 'Cs', '3.89', 'Lowest stable natural element']], col);

  h += secHead('Electronegativity (Pauling Scale)', col);
  h += tbl(['\u03c7 rank', 'Element', 'Value', 'Notes'],
    [['Highest', 'F (Fluorine)', '3.98', ''],
     ['2nd', 'O (Oxygen)', '3.44', ''],
     ['3rd', 'Cl (Chlorine)', '3.16', ''],
     ['4th', 'N (Nitrogen)', '3.04', ''],
     ['Mid', 'C (Carbon)', '2.55', ''],
     ['Mid', 'H (Hydrogen)', '2.20', ''],
     ['Low', 'Fe (Iron)', '1.83', ''],
     ['Low', 'Na (Sodium)', '0.93', 'Alkali metal'],
     ['Lowest', 'Cs (Cesium)', '0.79', '']], col);
  h += '<div style="font-size:11px;color:var(--muted);margin:.4rem 0 .75rem;line-height:1.6">' +
       '\u0394\u03c7 &gt; 1.7 = ionic bond &nbsp;|&nbsp; 0.4&#8211;1.7 = polar covalent &nbsp;|&nbsp; &lt; 0.4 = nonpolar covalent</div>';

  h += secHead('Scale of Matter', col);
  h += infoBox(
    '&#x2022; If the nucleus = a baseball (7 cm), the electron orbit would be 7 km away<br>' +
    '&#x2022; Atoms are 99.9999999999996% empty space<br>' +
    '&#x2022; 1 carbon atom = ~2\u00d710<sup>\u221222</sup> g<br>' +
    '&#x2022; 1 cm\u00b3 of water = ~3.34\u00d710<sup>22</sup> molecules<br>' +
    '&#x2022; Human body: ~7\u00d710<sup>27</sup> atoms (mostly H, O, C, N, Ca)', '168,85,247');

  el.innerHTML = statBar([
    {v: '118', l: 'Known elements', col: col},
    {v: '1.0073', l: 'Proton mass (u)', col: col},
    {v: '0.1&#8211;5 \u00c5', l: 'Atom diameter', col: col},
    {v: '1&#8211;10 fm', l: 'Nuclear radius', col: col}
  ]) + h;
}

// ── PARTICLES ────────────────────────────────────────────────────────────────

function renderParticles(el) {
  var col = '#22d3ee';
  var h = '';

  h += secHead('Standard Model Overview', col);
  h += infoBox(
    'The Standard Model describes <strong style="color:' + col + '">17 fundamental particles</strong>:<br>' +
    '&#x2022; 6 quarks + 6 leptons = 12 fermions (matter, spin \u00bd)<br>' +
    '&#x2022; 4 gauge bosons + 1 Higgs = 5 bosons (force carriers + mass)<br>' +
    '&#x2022; Every particle has an antiparticle: same mass, opposite charge<br>' +
    '&#x2022; Missing from model: gravity (graviton not yet observed)', '34,211,238');

  h += secHead('Quarks &#8212; 6 Flavors', col);
  h += tbl(['Quark', 'Symbol', 'Charge', 'Mass (MeV/c\u00b2)', 'Generation'],
    [['Up', 'u', '+\u2154', '2.2', '1st &#8212; in proton + neutron'],
     ['Down', 'd', '\u2212\u2153', '4.7', '1st &#8212; in proton + neutron'],
     ['Charm', 'c', '+\u2154', '1,280', '2nd'],
     ['Strange', 's', '\u2212\u2153', '96', '2nd'],
     ['Top', 't', '+\u2154', '172,760', '3rd &#8212; heaviest known particle'],
     ['Bottom', 'b', '\u2212\u2153', '4,180', '3rd']], col);
  h += '<div style="font-size:11px;color:var(--muted);margin:.4rem 0 .75rem;line-height:1.6">' +
       'Proton = uud (charge +1) &#x2022; Neutron = udd (charge 0) &#x2022; ' +
       'Quarks never exist alone (confinement) &#x2022; Bound by gluons via color charge</div>';

  h += secHead('Leptons &#8212; 6 Flavors', col);
  h += tbl(['Lepton', 'Symbol', 'Charge', 'Mass', 'Generation'],
    [['Electron', 'e\u207b', '\u22121', '0.511 MeV', '1st'],
     ['Electron neutrino', '\u03bd\u2091', '0', '&lt;2 eV', '1st'],
     ['Muon', '\u03bc\u207b', '\u22121', '105.7 MeV', '2nd &#8212; 207\u00d7 electron mass'],
     ['Muon neutrino', '\u03bd\u03bc', '0', '&lt;0.19 MeV', '2nd'],
     ['Tau', '\u03c4\u207b', '\u22121', '1,777 MeV', '3rd'],
     ['Tau neutrino', '\u03bd\u03c4', '0', '&lt;18.2 MeV', '3rd']], col);
  h += '<div style="font-size:11px;color:var(--muted);margin:.4rem 0 .75rem">~65 billion solar neutrinos pass through 1 cm\u00b2 of your hand every second. Muon decays in 2.2 \u03bcs.</div>';

  h += secHead('Gauge Bosons &#8212; Force Carriers', col);
  h += tbl(['Boson', 'Symbol', 'Force', 'Range', 'Mass (GeV)'],
    [['Photon', '\u03b3', 'Electromagnetic', 'Infinite', '0 &#8212; massless'],
     ['Gluon', 'g', 'Strong (QCD)', '&lt;1 fm', '0 &#8212; 8 color types'],
     ['W boson', 'W\u00b1', 'Weak', '~0.001 fm', '80.4'],
     ['Z boson', 'Z\u2070', 'Weak', '~0.001 fm', '91.2']], col);

  h += secHead('Higgs Boson', col);
  h += infoBox(
    '<strong style="color:' + col + '">H\u2070 &#x2022; Mass: 125.09 GeV/c\u00b2 &#x2022; Spin: 0</strong><br>' +
    'Discovered CERN LHC, July 4, 2012. Predicted by Peter Higgs + Brout-Englert in 1964.<br>' +
    'The Higgs <em>field</em> permeates all space. Particles that interact strongly with it acquire mass.<br>' +
    'Top quark = maximum interaction = heaviest. Photon = zero interaction = massless.<br>' +
    '"God particle" &#8212; nickname by Leon Lederman (1993). Nobel Prize 2013: Higgs, Englert.', '34,211,238');

  h += secHead('Four Fundamental Forces', col);
  h += tbl(['Force', 'Carrier', 'Range', 'Relative strength', 'Acts on'],
    [['Strong', 'Gluon', '~1 fm', '1 (reference)', 'Quarks, gluons'],
     ['Electromagnetic', 'Photon', 'Infinite', '1/137', 'Charged particles'],
     ['Weak', 'W/Z bosons', '0.001 fm', '10\u207b\u2076', 'All fermions'],
     ['Gravity', 'Graviton*', 'Infinite', '6\u00d710\u207b\u00b3\u2079', 'All mass/energy']], col);
  h += '<div style="font-size:11px;color:var(--muted);margin:.3rem 0 .8rem">*Graviton = theoretical, not yet observed. Gravity not included in Standard Model.</div>';

  h += secHead('Dark Matter &amp; Dark Energy', col);
  h += makeCards([
    {em: '\ud83c\udf0c', title: 'Universe Composition',
     sub: '27% dark matter &#x2022; 68% dark energy &#x2022; 5% ordinary matter',
     body: 'Everything ever seen, built, or measured = 4.9% of total universe content.<br><br>' +
           '&#x2022; Ordinary (baryonic) matter: 4.9%<br>' +
           '&#x2022; Dark matter: 26.8%<br>' +
           '&#x2022; Dark energy: 68.3%'},
    {em: '\ud83c\udf00', title: 'Dark Matter',
     sub: 'Does not emit, absorb, or reflect light',
     body: '<strong>Evidence:</strong><br>' +
           '&#x2022; Galactic rotation curves (Vera Rubin, 1970s): outer stars orbit too fast for visible mass<br>' +
           '&#x2022; Gravitational lensing: light bends more than visible matter predicts<br>' +
           '&#x2022; Bullet Cluster: two colliding galaxies &#8212; gravitational mass \u2260 gas location<br><br>' +
           '<strong>Candidates:</strong><br>' +
           '&#x2022; WIMPs &#8212; Weakly Interacting Massive Particles (~100\u00d7 proton mass, most favored)<br>' +
           '&#x2022; Axions &#8212; ultra-light particles, Peccei-Quinn theory<br>' +
           '&#x2022; Sterile neutrinos &#8212; heavier neutrino variant<br>' +
           '&#x2022; Primordial black holes &#8212; formed in early universe'},
    {em: '\u26ab', title: 'Dark Energy',
     sub: 'Driving accelerating expansion of the universe',
     body: 'Discovered 1998 via Type Ia supernovae &#8212; universe expansion is accelerating.<br>' +
           'Nobel Prize 2011: Perlmutter, Schmidt, Riess.<br><br>' +
           'Acts as Einstein\'s cosmological constant \u039b (his "biggest blunder" &#8212; he removed it; it came back).<br>' +
           'Energy density: ~6\u00d710\u207b\u00b9\u2070 J/m\u00b3 &#8212; uniform throughout all space.<br>' +
           'Nature: completely unknown.'},
    {em: '\u2728', title: 'Antimatter',
     sub: 'Every particle has an antiparticle',
     body: 'Positron (e\u207a) = anti-electron: same mass, charge +1.<br>' +
           'Antiproton (p\u0305) = charge \u22121.<br><br>' +
           'Annihilation: particle + antiparticle \u2192 2 photons (E = 2mc\u00b2).<br>' +
           'Matter-antimatter asymmetry: ~1 extra matter particle per 10\u2079 pairs &#8212; why the universe exists.'}
  ], col);

  el.innerHTML = statBar([
    {v: '17', l: 'Standard Model particles', col: col},
    {v: '4', l: 'Fundamental forces', col: col},
    {v: '68%', l: 'Dark energy', col: col},
    {v: '5%', l: 'Ordinary matter', col: col}
  ]) + h;
}

// ── MOLECULES ────────────────────────────────────────────────────────────────

window.calcMolar = function() {
  var inp = document.getElementById('mol-input');
  var res = document.getElementById('mol-result');
  if (!inp || !res) return;
  var q = inp.value.trim();
  if (!q) { res.innerHTML = '<span style="color:var(--muted)">Type a formula above.</span>'; return; }
  var atoms = {};
  var re = /([A-Z][a-z]?)(\d*)/g;
  var m;
  while ((m = re.exec(q)) !== null) {
    if (!m[1]) continue;
    atoms[m[1]] = (atoms[m[1]] || 0) + (parseInt(m[2]) || 1);
  }
  var keys = Object.keys(atoms);
  if (!keys.length) { res.innerHTML = '<span style="color:var(--muted)">Invalid formula.</span>'; return; }
  var mw = keys.reduce(function(s, k) { return s + (ATOMIC_W[k] || 0) * atoms[k]; }, 0);
  var unk = keys.filter(function(k) { return !ATOMIC_W[k]; });
  var html = '<div style="font-family:monospace;font-size:14px;font-weight:800;color:#4ade80;margin-bottom:.5rem">' + q + '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px;margin-bottom:.6rem">';
  [{l:'Molar mass',v:mw?mw.toFixed(4)+' g/mol':'unknown'},{l:'Atoms/molecule',v:keys.reduce(function(s,k){return s+atoms[k];},0)},{l:'Elements',v:keys.length},{l:'Avogadro N',v:'6.022\u00d710\u00b2\u00b3'}].forEach(function(s){
    html += '<div style="background:var(--bg3);border-radius:6px;padding:.35rem .55rem"><div style="font-size:9px;color:var(--muted)">' + s.l + '</div><div style="font-size:12px;font-weight:700;color:var(--fg)">' + s.v + '</div></div>';
  });
  html += '</div><div style="font-size:10.5px;color:var(--muted)">Breakdown: ';
  html += keys.map(function(k){ var pct=mw?((ATOMIC_W[k]||0)*atoms[k]/mw*100).toFixed(1):0; return '<span style="color:#4ade80;font-family:monospace">'+k+'\u00d7'+atoms[k]+'</span> '+pct+'%'; }).join(' &nbsp;|&nbsp; ');
  html += '</div>';
  if (unk.length) html += '<div style="font-size:10px;color:#f87171;margin-top:.3rem">Unknown: ' + unk.join(', ') + '</div>';
  if (mw) html += '<div style="font-size:10px;color:var(--muted);margin-top:.25rem">1 mol = ' + mw.toFixed(2) + 'g &nbsp;|&nbsp; 1g = ' + (1/mw*6.022e23).toExponential(3) + ' molecules</div>';
  res.innerHTML = html;
};

window.updatePH = function(ph) {
  ph = parseFloat(ph);
  var slider = document.getElementById('ph-slider');
  var disp = document.getElementById('ph-display');
  var marker = document.getElementById('ph-marker');
  var info = document.getElementById('ph-info');
  if (slider) slider.value = ph;
  if (disp) disp.textContent = ph.toFixed(1);
  if (marker) marker.style.left = (ph / 14 * 100).toFixed(1) + '%';
  if (!info) return;
  var cat, col2, ex;
  if (ph <= 1) { cat = 'Strong acid'; col2 = '#ef4444'; ex = 'Battery acid, HCl (conc.)'; }
  else if (ph < 3) { cat = 'Weak acid'; col2 = '#f97316'; ex = 'Stomach acid (1.5), vinegar (2.5), lemon (2)'; }
  else if (ph < 5) { cat = 'Mild acid'; col2 = '#eab308'; ex = 'Coffee (5), tomato (4.5), beer (4)'; }
  else if (ph < 7) { cat = 'Near neutral &#8212; acidic'; col2 = '#84cc16'; ex = 'Rain (5.6), urine (6), skin (5)'; }
  else if (ph === 7) { cat = 'Neutral'; col2 = '#22c55e'; ex = 'Pure water'; }
  else if (ph < 8) { cat = 'Near neutral &#8212; basic'; col2 = '#10b981'; ex = 'Blood (7.4), saliva (6.5&#8211;7.5)'; }
  else if (ph < 10) { cat = 'Mild base'; col2 = '#06b6d4'; ex = 'Seawater (8.2), baking soda (9), soap (9&#8211;10)'; }
  else if (ph < 12) { cat = 'Weak base'; col2 = '#3b82f6'; ex = 'Milk of magnesia (10.5), ammonia (11)'; }
  else { cat = 'Strong base'; col2 = '#6366f1'; ex = 'Bleach (12.5), drain cleaner (13), NaOH (14)'; }
  var hconc = Math.pow(10, -ph).toExponential(2);
  info.innerHTML = '<strong style="color:' + col2 + '">' + cat + '</strong> &#x2022; [H\u207a] = ' + hconc + ' mol/L &#x2022; ' + ex;
};

window.calcHL = function() {
  var n0 = parseFloat(document.getElementById('hl-n0').value);
  var t12 = parseFloat(document.getElementById('hl-t12').value);
  var t = parseFloat(document.getElementById('hl-t').value);
  var res = document.getElementById('hl-result');
  if (!res) return;
  if (isNaN(n0) || isNaN(t12) || isNaN(t) || t12 <= 0 || n0 < 0 || t < 0) {
    res.innerHTML = '<span style="color:#f87171">Enter valid positive numbers.</span>';
    return;
  }
  var n = n0 * Math.pow(0.5, t / t12);
  var pct = n0 > 0 ? (n / n0 * 100) : 0;
  var nHL = t / t12;
  var lam = Math.LN2 / t12;
  res.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px">' +
    [['Remaining N(t)', n.toExponential(4), '#f87171'],
     ['Decayed amount', (n0 - n).toExponential(4), '#fbbf24'],
     ['% remaining', pct.toFixed(4) + '%', '#4ade80'],
     ['Half-lives elapsed', nHL.toFixed(3), '#22d3ee'],
     ['Decay constant \u03bb', lam.toExponential(3) + '/unit', '#a78bfa']].map(function(s) {
       return '<div style="background:var(--bg3);border-radius:6px;padding:.35rem .55rem">' +
              '<div style="font-size:9px;color:var(--muted)">' + s[0] + '</div>' +
              '<div style="font-size:12px;font-weight:700;color:' + s[2] + '">' + s[1] + '</div></div>';
     }).join('') + '</div>' +
    '<div style="font-size:10px;color:var(--muted);margin-top:.4rem">' +
    'N(t) = N\u2080 \u00d7 (1/2)<sup>t/t\u00bd</sup> &nbsp;|&nbsp; \u03bb = ln(2)/t\u00bd &nbsp;|&nbsp; A = \u03bbN</div>';
};

window.calcSWU = function() {
  var xp = parseFloat(document.getElementById('swu-xp').value) / 100;
  var xf = parseFloat(document.getElementById('swu-xf').value) / 100;
  var xw = parseFloat(document.getElementById('swu-xw').value) / 100;
  var P = parseFloat(document.getElementById('swu-p').value);
  var res = document.getElementById('swu-result');
  if (!res) return;
  if ([xp, xf, xw, P].some(isNaN) || xp <= xw || xf <= xw || xp <= xf) {
    res.innerHTML = '<span style="color:#f87171">Check values: xp > xf > xw required.</span>';
    return;
  }
  function V(x) { return (1 - 2*x) * Math.log((1-x)/x); }
  var F = P * (xp - xw) / (xf - xw);
  var W = F - P;
  var swu = P * V(xp) + W * V(xw) - F * V(xf);
  var col2 = '#f87171';
  res.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px">' +
    [['Product (P)', P.toFixed(2) + ' kg', col2],
     ['Feed (F)', F.toFixed(2) + ' kg', '#fbbf24'],
     ['Tails (W)', W.toFixed(2) + ' kg', '#94a3b8'],
     ['SWU', swu.toFixed(2), '#4ade80'],
     ['Feed/Product', (F/P).toFixed(2) + ' kg/kg', '#22d3ee']].map(function(s) {
       return '<div style="background:var(--bg3);border-radius:6px;padding:.35rem .55rem">' +
              '<div style="font-size:9px;color:var(--muted)">' + s[0] + '</div>' +
              '<div style="font-size:12px;font-weight:700;color:' + s[2] + '">' + s[1] + '</div></div>';
     }).join('') + '</div>' +
    '<div style="font-size:10px;color:var(--muted);margin-top:.4rem">' +
    'V(x) = (1\u22122x)\u00b7ln((1\u2212x)/x) &nbsp;|&nbsp; SWU = P\u00b7V(xp) + W\u00b7V(xw) \u2212 F\u00b7V(xf)</div>';
};

var _nucCol = '#f87171';

window.calcHL = function() {
  var n0 = parseFloat(document.getElementById('hl-n0').value);
  var t12 = parseFloat(document.getElementById('hl-t12').value);
  var t = parseFloat(document.getElementById('hl-t').value);
  var res = document.getElementById('hl-result');
  if (!res) return;
  if (isNaN(n0) || isNaN(t12) || isNaN(t) || t12 <= 0 || n0 < 0 || t < 0) {
    res.innerHTML = '<span style="color:#f87171">Enter valid positive numbers.</span>';
    return;
  }
  var n = n0 * Math.pow(0.5, t / t12);
  var pct = n0 > 0 ? (n / n0 * 100) : 0;
  var nHL = t / t12;
  var lam = Math.LN2 / t12;
  res.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px">' +
    [['Remaining N(t)', n.toExponential(4), '#f87171'],
     ['Decayed amount', (n0 - n).toExponential(4), '#fbbf24'],
     ['% remaining', pct.toFixed(4) + '%', '#4ade80'],
     ['Half-lives elapsed', nHL.toFixed(3), '#22d3ee'],
     ['Decay constant \u03bb', lam.toExponential(3) + '/unit', '#a78bfa']].map(function(s) {
       return '<div style="background:var(--bg3);border-radius:6px;padding:.35rem .55rem">' +
              '<div style="font-size:9px;color:var(--muted)">' + s[0] + '</div>' +
              '<div style="font-size:12px;font-weight:700;color:' + s[2] + '">' + s[1] + '</div></div>';
     }).join('') + '</div>' +
    '<div style="font-size:10px;color:var(--muted);margin-top:.4rem">' +
    'N(t) = N\u2080 \u00d7 (1/2)<sup>t/t\u00bd</sup> &nbsp;|&nbsp; \u03bb = ln(2)/t\u00bd &nbsp;|&nbsp; A = \u03bbN</div>';
};

window.calcKc = function() {
  var cA = parseFloat(document.getElementById('kc-a').value);
  var cB = parseFloat(document.getElementById('kc-b').value);
  var cC = parseFloat(document.getElementById('kc-c').value);
  var cD = parseFloat(document.getElementById('kc-d').value);
  var sa = parseFloat(document.getElementById('kc-sa').value) || 1;
  var sb = parseFloat(document.getElementById('kc-sb').value) || 1;
  var sc = parseFloat(document.getElementById('kc-sc').value) || 1;
  var sd = parseFloat(document.getElementById('kc-sd').value) || 1;
  var res = document.getElementById('kc-result');
  if (!res) return;
  if ([cA, cB, cC, cD].some(function(v) { return isNaN(v) || v < 0; })) {
    res.innerHTML = '<span style="color:#f87171">Enter valid non-negative concentrations.</span>';
    return;
  }
  var num = Math.pow(cC, sc) * Math.pow(cD, sd);
  var den = Math.pow(cA, sa) * Math.pow(cB, sb);
  var kc = den > 0 ? num / den : Infinity;
  var col2 = '#22d3ee';
  var interpret = kc > 1000 ? 'Products strongly favored (\u226b1)' :
                  kc > 1 ? 'Products favored' :
                  kc === 1 ? 'Neither side favored' :
                  kc > 0.001 ? 'Reactants favored' : 'Reactants strongly favored (\u226a1)';
  res.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">' +
    ['Kc = ' + kc.toExponential(4), '\u0394G\u00b0 related: RTln(Kc)'].map(function(s) {
       return '<div style="background:var(--bg3);border-radius:6px;padding:.35rem .55rem;font-size:12px;color:' + col2 + ';font-weight:700">' + s + '</div>';
    }).join('') + '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:.4rem">' + interpret + '</div>' +
    '<div style="font-size:10px;color:var(--muted);margin-top:.2rem">' +

window.calcHH = function() {
  var pka = parseFloat(document.getElementById('hh-pka').value);
  var base = parseFloat(document.getElementById('hh-base').value);
  var acid = parseFloat(document.getElementById('hh-acid').value);
  var res = document.getElementById('hh-result');
  if (!res) return;
  if (isNaN(pka) || isNaN(base) || isNaN(acid) || acid <= 0 || base < 0) {
    res.innerHTML = '<span style="color:#f87171">Enter valid values. Acid concentration must be &gt; 0.</span>';
    return;
  }
  var ph = pka + Math.log10(base / acid);
  var hconc = Math.pow(10, -ph).toExponential(3);
  res.innerHTML = '<div style="font-size:1.1rem;font-weight:800;color:#22d3ee">pH = ' + ph.toFixed(2) + '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:.3rem">' +
    '[H\u207a] = ' + hconc + ' mol/L &nbsp;|&nbsp; ' +
    'Ratio [A\u207b]/[HA] = ' + (base / acid).toFixed(3) +
    '</div>';
};

  h += secHead("Le Chatelier's Principle", col);
  h += makeCards([

     sub: 'System at equilibrium shifts to oppose any imposed stress',
     body: 'Add reactant \u2192 shifts right (more products)<br>' +
           'Remove product \u2192 shifts right<br>' +
           'Increase pressure (gas) \u2192 shifts toward fewer moles of gas<br>' +
           'Increase temperature \u2192 favors endothermic direction<br>' +
           'Catalyst \u2192 reaches equilibrium faster, does not shift position<br><br>' +
           '<strong>Example &#8212; Haber process:</strong> N\u2082 + 3H\u2082 \u21cc 2NH\u2083 (\u0394H = \u221292 kJ/mol)<br>' +
           'High pressure favors NH\u2083 (4 moles gas \u2192 2 moles). High T speeds reaction but reduces yield.'},
    {em: '\ud83d\udcca', title: 'Reaction Quotient Q vs Kc',

     body: 'Q = [C]\u1d9c[D]\u1d9f / [A]\u1d43[B]\u1d47 (same expression as Kc, but using current concentrations)<br><br>' +
           'Q &lt; Kc \u2192 reaction proceeds forward (more products form)<br>' +
           'Q &gt; Kc \u2192 reaction proceeds reverse (more reactants form)<br>' +

           'pKa (carbonic acid H\u2082CO\u2083) = 6.35 &#8212; blood buffer system<br>' +
           'Ksp (AgCl) = 1.8 \u00d7 10\u207b\u00b9\u2070 &#8212; nearly insoluble<br>' +
           'Ksp (CaCO\u2083) = 3.3 \u00d7 10\u207b\u2079'}
  ], col);

  el.innerHTML = statBar([

window.calcCell = function() {
  var ci = parseInt(document.getElementById('ec-cat').value);
  var ai = parseInt(document.getElementById('ec-an').value);
  var res = document.getElementById('ec-result');
  if (!res) return;
  if (ci === ai) { res.innerHTML = '<span style="color:#f87171">Cathode and anode must be different half-cells.</span>'; return; }
  var cat = EC_DATA[ci], an = EC_DATA[ai];
  var ecell = cat.e - an.e;
  var spont = ecell > 0;
  var col2 = spont ? '#4ade80' : '#f87171';
  res.innerHTML = '<div style="font-size:1rem;font-weight:800;color:' + col2 + '">E\u00b0cell = ' + ecell.toFixed(3) + ' V &nbsp; &#8212; &nbsp; ' + (spont ? 'Spontaneous (galvanic)' : 'Non-spontaneous (electrolytic)') + '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:.4rem;line-height:1.8">' +
    'Cathode (+): ' + cat.n + ' &nbsp; E\u00b0 = ' + cat.e + ' V (reduction)<br>' +
    'Anode (\u2212): ' + an.n + ' &nbsp; E\u00b0 = ' + an.e + ' V (oxidation = ' + (-an.e).toFixed(3) + ' V)<br>' +
    'E\u00b0cell = E\u00b0cathode \u2212 E\u00b0anode = ' + cat.e + ' \u2212 (' + an.e + ') = ' + ecell.toFixed(3) + ' V<br>' +
    '\u0394G\u00b0 = \u2212nFE\u00b0 &nbsp;|&nbsp; ' + (spont ? '\u0394G\u00b0 &lt; 0 (spontaneous)' : '\u0394G\u00b0 &gt; 0 (requires energy input)') +
    '</div>';
};

window.calcAPI = function() {
  var sg = parseFloat(document.getElementById('api-sg').value);
  var res = document.getElementById('api-result');
  if (!res) return;
  if (isNaN(sg) || sg <= 0) { res.innerHTML = '<span style="color:#f87171">Enter valid specific gravity (e.g. 0.85).</span>'; return; }
  var api = 141.5 / sg - 131.5;
  var grade = api > 31.1 ? 'Light crude' : api > 22.3 ? 'Medium crude' : api > 10 ? 'Heavy crude' : 'Extra-heavy / bitumen';
  var col2 = api > 31.1 ? '#4ade80' : api > 22.3 ? '#fbbf24' : '#f97316';
  res.innerHTML = '<div style="font-size:1.1rem;font-weight:800;color:' + col2 + '">\u00b0API = ' + api.toFixed(2) + '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:.3rem">' + grade + ' &nbsp;\u2022&nbsp; SG = ' + sg.toFixed(4) + '</div>' +
    '<div style="font-size:10px;color:var(--muted);margin-top:.2rem">\u00b0API = 141.5 / SG\u2086\u2080 \u2212 131.5</div>';
};

window.calcLHSV = function() {

  if (!res) return;

    '<div style="font-size:10px;color:var(--muted);margin-top:.25rem">Residence time = ' + (1/lhsv * 60).toFixed(1) + ' min</div>';
};
